<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Panel · Taller Creativo EK</title>
  <link rel="icon" href="../img/favicon/favicon-32x32.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body>

  <!-- ===================== LOGIN ===================== -->
  <div class="login" id="vista-login" hidden>
    <form class="login__card" id="form-login">
      <div class="login__logo">
        <img src="../img/logo/logo-taller-creativo-ek.png" alt="Taller Creativo EK">
        <h1>Panel administrativo</h1>
        <p>Inicia sesión para gestionar tu tienda</p>
      </div>
      <div class="field">
        <label>Correo</label>
        <input type="email" id="login-email" autocomplete="username" value="admin@ek.com" required>
      </div>
      <div class="field">
        <label>Contraseña</label>
        <input type="password" id="login-pass" autocomplete="current-password" required>
      </div>
      <div id="login-error" style="color:var(--rojo);font-size:.85rem;margin:0 0 12px"></div>
      <button class="btn btn--rojo" type="submit" style="width:100%;justify-content:center" id="btn-login">
        <i class="bi bi-box-arrow-in-right"></i> Entrar
      </button>
    </form>
  </div>

  <!-- ===================== APP ===================== -->
  <div class="app" id="vista-app" hidden>
    <aside class="sidebar">
      <div class="sidebar__brand">
        <img src="../img/logo/logo-taller-creativo-ek.png" alt="">
        <b>Panel EK</b>
      </div>
      <nav id="nav">
        <a href="#/dashboard" data-sec="dashboard"><i class="bi bi-speedometer2"></i> Resumen</a>
        <a href="#/productos" data-sec="productos"><i class="bi bi-box-seam"></i> Productos</a>
        <a href="#/categorias" data-sec="categorias"><i class="bi bi-tags"></i> Categorías</a>
        <a href="#/subcategorias" data-sec="subcategorias"><i class="bi bi-diagram-3"></i> Subcategorías</a>
        <a href="#/banners" data-sec="banners"><i class="bi bi-images"></i> Banners</a>
        <a href="#/blog" data-sec="blog"><i class="bi bi-journal-text"></i> Blog</a>
        <a href="#/resenas" data-sec="resenas"><i class="bi bi-star"></i> Reseñas</a>
        <a href="#/pedidos" data-sec="pedidos"><i class="bi bi-receipt"></i> Pedidos</a>
        <a href="#/clientes" data-sec="clientes"><i class="bi bi-people"></i> Clientes</a>
        <a href="#/cupones" data-sec="cupones"><i class="bi bi-ticket-perforated"></i> Cupones</a>
        <a href="#/configuracion" data-sec="configuracion"><i class="bi bi-sliders"></i> Configuración</a>
      </nav>
      <div class="sidebar__foot">
        Sesión: <b id="usuario-nombre">…</b>
      </div>
    </aside>

    <main class="main">
      <div class="topbar">
        <h1 id="titulo-seccion">Resumen</h1>
        <div class="topbar__right">
          <button class="btn btn--ghost btn--sm" id="btn-publicar" title="Regenera los archivos estáticos y redeploya en Cloudflare">
            <i class="bi bi-cloud-arrow-up"></i> Publicar cambios
          </button>
          <button class="btn btn--rojo btn--sm" id="btn-salir"><i class="bi bi-box-arrow-right"></i> Salir</button>
        </div>
      </div>
      <div id="contenido"></div>
    </main>
  </div>

  <div class="toast" id="toast"></div>
  <div class="modal" id="modal"><div class="modal__box" id="modal-box"></div></div>

  <script src="app.js"></script>
</body>
</html>
