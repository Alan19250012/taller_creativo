<script>
(function () {
  "use strict";
  var C = window.EK_CONFIG || {};
  var SEC = [
    { id: "privacidad", icono: "bi-shield-lock", titulo: "Política de privacidad", clave: "politica_privacidad", fallback: "Protegemos tus datos personales y solo los usamos para procesar tu pedido y contactarte." },
    { id: "envios", icono: "bi-truck", titulo: "Política de envíos", clave: "politica_envios", fallback: "Envíos a todo México por paquetería (2 a 5 días hábiles). Envío gratis desde $999." },
    { id: "devoluciones", icono: "bi-arrow-repeat", titulo: "Política de devoluciones", clave: "politica_devoluciones", fallback: "Aceptamos cambios por defecto de fabricación. Avísanos dentro de los 7 días posteriores a la entrega." },
    { id: "terminos", icono: "bi-file-earmark-text", titulo: "Términos y condiciones", clave: "politica_terminos", fallback: "Al realizar un pedido aceptas los términos y condiciones de Taller Creativo EK." }
  ];
  var cont = document.getElementById("politicas");
  if (cont) {
    var visibles = SEC.filter(function (s) { return C[s.clave + "_activa"] !== "false"; });
    cont.innerHTML = visibles.map(function (s) {
      var contenido = C[s.clave] || ("<p>" + s.fallback + "</p>");
      return '<section id="' + s.id + '" class="ek-buy" style="margin-bottom:16px">' +
        '<h2 style="display:flex;align-items:center;gap:10px;font-size:1.25rem"><i class="bi ' + s.icono + '" style="color:var(--rojo)"></i> ' + s.titulo + "</h2>" +
        '<div style="color:#374151;line-height:1.75">' + contenido + "</div></section>";
    }).join("");
    if (!visibles.length) cont.innerHTML = '<div class="ek-empty"><p>Pronto publicaremos nuestras políticas. Gracias por tu paciencia.</p></div>';
  }
})();
</script>
